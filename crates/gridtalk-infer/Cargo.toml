[package]
name = "gridtalk-infer"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
toml = "0.9"
candle-core = { version = "0.10", optional = true, default-features = false }
candle-transformers = { version = "0.10", optional = true }
tokenizers = { version = "0.22", optional = true, default-features = false, features = ["progressbar"] }

[features]
default = []
# Engine rungs are feature-gated so a candle or mistral.rs build never
# pays the llama-cpp native-build cost unless explicitly selected.
candle = ["dep:candle-core"]
# Real GGUF generation (llama-family architectures) on candle.
candle-gen = ["candle", "dep:candle-transformers", "dep:tokenizers"]
mistralrs = []
llamacpp = []
