[package]
name = "gridtalk-infer"
version = "0.4.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
toml = "0.9"
llama-cpp-2 = { version = "=0.1.160", features = ["vulkan"] }
# Renders a GGUF's own Jinja chat template when llama.cpp's built-in
# applier does not recognise it (Gemma 4, Spark-X2.6).
minijinja = { version = "3.1", features = ["json"] }
minijinja-contrib = { version = "3.1", features = ["pycompat"] }
# TLS for https endpoints and model downloads: pure-Rust rustls on the
# ring provider (no CMake/NASM toolchain), Mozilla roots bundled.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"

[dev-dependencies]
rcgen = "0.14"

[features]
default = []
