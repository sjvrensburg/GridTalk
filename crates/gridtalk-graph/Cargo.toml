[package]
name = "gridtalk-graph"
version = "0.5.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
serde.workspace = true
gridcraft-xlsx = { path = "../../vendor/gridcraft/crates/xlsx" }
gridcraft-model = { path = "../../vendor/gridcraft/crates/model" }
gridcraft-core = { path = "../../vendor/gridcraft/crates/core" }
gridcraft-calc = { path = "../../vendor/gridcraft/crates/calc" }
gridcraft-formula = { path = "../../vendor/gridcraft/crates/formula" }
# Only to read a package's zip directory before Gridcraft parses it;
# the same version and features as Gridcraft's own.
zip = { version = "3", default-features = false, features = ["deflate"] }

[dev-dependencies]
# Builds encrypted workbooks and compound (CFB) files in tests.
gridcraft-xlsx = { path = "../../vendor/gridcraft/crates/xlsx", features = ["test-support"] }
