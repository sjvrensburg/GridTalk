[package]
name = "gridtalk-graph"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = ["gridcraft"]
# XLSX/ODS ingestion through the vendored Gridcraft engine crates.
gridcraft = ["dep:gridcraft-xlsx", "dep:gridcraft-model", "dep:gridcraft-core"]

[dependencies]
serde.workspace = true
gridcraft-xlsx = { path = "../../vendor/gridcraft/crates/xlsx", optional = true }
gridcraft-model = { path = "../../vendor/gridcraft/crates/model", optional = true }
gridcraft-core = { path = "../../vendor/gridcraft/crates/core", optional = true }
