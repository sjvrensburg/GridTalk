[package]
name = "gridtalk-app"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "gridtalk"
path = "src/main.rs"

[features]
candle = ["gridtalk-infer/candle"]
candle-gen = ["gridtalk-infer/candle-gen"]
mistralrs = ["gridtalk-infer/mistralrs"]
llamacpp = ["gridtalk-infer/llamacpp"]

[dependencies]
gridtalk-graph = { path = "../gridtalk-graph" }
gridtalk-index = { path = "../gridtalk-index" }
gridtalk-infer = { path = "../gridtalk-infer" }
serde.workspace = true
serde_json.workspace = true
