[workspace]
resolver = "2"
members = [
    "crates/gridtalk-adapter",
    "crates/gridtalk-graph",
    "crates/gridtalk-index",
    "crates/gridtalk-infer",
    "crates/gridtalk-app",
    "crates/gridtalk-ui",
]
# Gridcraft is vendored as a git submodule under vendor/gridcraft for
# reference and staged integration. It is not a workspace member yet:
# GridTalk crates must depend only on its public model/calc surface once
# that integration lands (see docs/decisions/0001-fork-vs-embed.md).
exclude = ["vendor/gridcraft"]

[workspace.package]
edition = "2021"
license = "MIT"
rust-version = "1.95"

[workspace.dependencies]
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
