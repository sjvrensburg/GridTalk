name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # gridtalk-graph path-depends on the vendored Gridcraft crates.
          submodules: true
      - name: Install Rust
        shell: bash
        run: rustup toolchain install stable --component rustfmt,clippy --profile minimal && rustup default stable
      - run: cargo fmt --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
  features:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: true
      - name: Install Rust
        shell: bash
        run: rustup toolchain install stable --component clippy --profile minimal && rustup default stable
      - name: Clippy + test candle-gen feature
        run: |
          cargo clippy --locked -p gridtalk-infer -p gridtalk-app --all-targets --features candle-gen -- -D warnings
          cargo test --locked -p gridtalk-infer -p gridtalk-app --features candle-gen
      - name: Test mistralrs feature
        run: cargo test --locked -p gridtalk-infer --features mistralrs
