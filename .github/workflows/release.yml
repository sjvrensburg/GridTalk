name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
      - name: Build release binaries
        run: cargo build --release -p gridtalk-app -p gridtalk-ui
      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/gridtalk target/release/gridtalk-ui dist/
          cp README.md LICENSE-MIT config.example.toml dist/
          tar -czf "gridtalk-${{ github.ref_name }}-${{ runner.os }}.tar.gz" -C dist .
      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist
          Copy-Item target/release/gridtalk.exe, target/release/gridtalk-ui.exe, README.md, LICENSE-MIT, config.example.toml dist/
          Compress-Archive -Path dist/* -DestinationPath "gridtalk-${{ github.ref_name }}-Windows.zip"
      - name: Upload to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ github.ref_name }}" >/dev/null 2>&1 || gh release create "${{ github.ref_name }}" --generate-notes
          gh release upload "${{ github.ref_name }}" gridtalk-* --clobber
