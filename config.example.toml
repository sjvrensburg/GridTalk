# GridTalk settings. Copy to the GridTalk config directory:
# Linux ~/.config/gridtalk/config.toml, Windows %APPDATA%\gridtalk\config.toml
# (or point GRIDTALK_CONFIG / GRIDTALK_CONFIG_DIR at your own location).
# The API key itself is never stored here — only the NAME of the
# environment variable that holds it.

[inference]
# "local" (default, nothing leaves your PC) or "openai-compatible"
backend = "local"
# The only local engine is llama.cpp over Vulkan.
engine = "llamacpp"
# model_path = "/home/you/.cache/gridtalk/models/Qwen3-30B-A3B-Instruct-2507-Q4_K_M.gguf"  # any GGUF, incl. MoE
# base_url = "http://127.0.0.1:11434/v1"   # external backend / redacting proxy
# base_url = "https://api.example.com/v1"   # https: certificate-verified TLS
# An API key goes over plain http only to a loopback host; use https
# otherwise. Extra trusted CAs (corporate or self-signed): set
# GRIDTALK_CA_FILE=/path/to/ca.pem
# api_key_env = "GRIDTALK_API_KEY"
